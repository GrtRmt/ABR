    <path d="M 165 25 L 308 108 L 308 190 L 264 190 C 253 190, 248 200, 242 197 C 236 193, 250 177, 250 163 C 250 147, 242 135, 236.5 135 C 231 135, 223 147, 223 163 C 223 177, 237 193, 231 197 C 225 200, 220 190, 209 190 L 165 190 L 165 135 C 165 124, 155 119, 158 113 C 162 107, 178 121, 192 121 C 208 121, 220 113, 220 107.5 C 220 102, 208 94, 192 94 C 178 94, 162 108, 158 102 C 155 96, 165 91, 165 80 L 165 25 Z" fill="#002A54" />

    <!-- Outer Hexagon Frame -->
    <polygon points="165,25 308,108 308,273 165,355 22,273 22,108" stroke="#002A54" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" fill="none" />

    <!-- Seam 1: Vertical Top (Y: 25 -> 190), Tab enters right into Piece 1 -->
    <path d="M 165 25 L 165 80 C 165 91, 155 96, 158 102 C 162 108, 178 94, 192 94 C 208 94, 220 102, 220 107.5 C 220 113, 208 121, 192 121 C 178 121, 162 107, 158 113 C 155 119, 165 124, 165 135 L 165 190" stroke="#002A54" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Seam 2: Horizontal Right (X: 165 -> 308), Tab enters up into Piece 1 -->
    <path d="M 165 190 L 209 190 C 220 190, 225 200, 231 197 C 237 193, 223 177, 223 163 C 223 147, 231 135, 236.5 135 C 242 135, 250 147, 250 163 C 250 177, 236 193, 242 197 C 248 200, 253 190, 264 190 L 308 190" stroke="#002A54" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Seam 3: Horizontal Left (X: 22 -> 165), Tab enters down into Piece 3 -->
    <path d="M 22 190 L 66 190 C 77 190, 82 180, 88 183 C 94 187, 80 203, 80 217 C 80 233, 88 245, 93.5 245 C 99 245, 107 233, 107 217 C 107 203, 93 187, 99 183 C 105 180, 110 190, 121 190 L 165 190" stroke="#002A54" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Seam 4: Vertical Bottom (Y: 190 -> 355), Tab enters right into Piece 4 -->
    <path d="M 165 190 L 165 245 C 165 256, 155 261, 158 267 C 162 273, 178 259, 192 259 C 208 259, 220 267, 220 272.5 C 220 278, 208 286, 192 286 C 178 286, 162 272, 158 278 C 155 284, 165 289, 165 300 L 165 355" stroke="#002A54" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Brand Typography -->
    <text x="345" y="195" class="remaut-title" textLength="600" lengthAdjust="spacingAndGlyphs">REMAUT</text>
    <text x="345" y="295" class="remaut-sub" textLength="600" lengthAdjust="spacing">verzekeringen</text>
  </g>
</svg>