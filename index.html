                "@type": "Answer",
                "text": "Nee, een ABR-verzekering is voor een particuliere bouwheer in België wettelijk niet verplicht, maar wordt unaniem aangeraden door architecten, notarissen en banken. Zonder ABR bent u bij materiële schade of zettingsschade bij de buren aangewezen op lange gerechtelijke procedures. De wet verplicht sinds 2018 wel de 10-jarige aansprakelijkheidsverzekering voor aannemers (stabiliteit), maar die dekt géén werfschade, storm of diefstal tijdens de bouw."

                "text": "De BA-verzekering van een aannemer keert enkel uit als er een onweerlegbare fout en aansprakelijkheid van díé specifieke aannemer bewezen wordt. Als meerdere aannemers op de werf naar elkaar wijzen, keert niemand uit en kan uw werf maandenlang stilliggen. De ABR-verzekering werkt volgens het No-Fault principe: de schade aan uw werf wordt meteen vergoed, ongeacht wie de fout beging."
              }
            },
